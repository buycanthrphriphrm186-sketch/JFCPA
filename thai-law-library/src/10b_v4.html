<style>
/* ======================= v4: ปรับปรุงตามรายการแก้ไข ======================= */
:root{--wk-bg:#E3F5E8;--wk-ink:#16733A;--wk-line:#B9E3C6}
:root[data-theme="dark"]{--wk-bg:#123322;--wk-ink:#8FE0A9;--wk-line:#1E5236}
@media (prefers-color-scheme: dark){:root[data-theme="system"]{--wk-bg:#123322;--wk-ink:#8FE0A9;--wk-line:#1E5236}}
/* ฟอนต์ทางการ (สไตล์ TH Sarabun) ทุกองค์ประกอบ ขนาดตามอุปกรณ์ ไม่ล้นกรอบ */
button,input,select,textarea,optgroup{font-family:inherit}
body{overflow-wrap:break-word}
h1,h2,h3,h4{overflow-wrap:break-word;hyphens:auto}

/* ---- การจัดข้อความ: มือถือ ≤768px ชิดซ้ายไม่ย่อหน้า / ≥769px เต็มแนว ย่อหน้า 2em ---- */
.prose p,.law-text p,.rte-page p,.fv-text p{margin:0 0 1em;line-height:1.6;overflow-wrap:break-word;word-break:normal;hyphens:auto;-webkit-hyphens:auto;letter-spacing:normal;word-spacing:normal}
@media (max-width:768px){
  .prose p,.law-text p,.fv-text p{text-align:left;text-indent:0}
  .law-text p.item{padding-left:1.1em}
  .law-text p.item.sub{padding-left:2.2em}
}
@media (min-width:769px){
  .prose p,.law-text p,.fv-text p{text-align:justify;text-justify:inter-word;text-indent:2em}
  .prose p.noindent,.law-text p.item,.law-text p.note{text-indent:0}
  .law-text p.item{padding-left:2em}
  .law-text p.item.sub{padding-left:4em}
}
.law-text p.note{font-size:.86rem;color:var(--muted)}
/* ป้ายวรรค/อนุมาตรา สีเขียวอ่อน */
.wk{display:inline-block;text-indent:0;margin-right:.45em;padding:0 .5em;border-radius:6px;background:var(--wk-bg);color:var(--wk-ink);border:1px solid var(--wk-line);font-size:.78em;font-weight:700;line-height:1.55;vertical-align:.08em;white-space:nowrap}
.wk.sub{font-weight:600}

/* ---- ป้ายในหน้ารายการ: ไม่พลิก ขนาดตามเนื้อหา กดเพื่อขยาย ---- */
.cards .flip.gcard{cursor:pointer;outline:none}
.cards .flip.gcard .flip-in{height:auto;min-height:200px;transform:none !important}
.cards .flip.gcard .face.front{position:relative;inset:auto;min-height:200px}
.cards .flip.gcard:focus-visible .face{box-shadow:0 0 0 3px var(--sky-300)}
.cards .flip.gcard:hover .face{box-shadow:var(--shadow-2)}
.cards .flip.gcard .face .pname{-webkit-line-clamp:unset;display:block;overflow:visible}
.face .law-s .hd{font-weight:500;color:var(--faint);font-size:.95em}
.face .snip{font-size:.86rem;color:var(--muted);text-align:left;line-height:1.55;max-width:100%}
.face .open-hint{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--sky-700);font-weight:600}
.face .open-hint svg{width:14px;height:14px}

/* ---- ป้ายขยาย: ซ้อนสองด้านด้วย grid ความสูงเท่าเนื้อหา เลื่อนจากด้านนอก ---- */
html.scroll-lock,html.scroll-lock body{overflow:hidden !important;overscroll-behavior:none}
html.scroll-lock body{position:fixed;left:0;right:0;width:100%}
.focus{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;justify-content:flex-start}
.focus.no-anim{animation:none}
.focus .stagec{margin:0 auto;padding-bottom:8px}
.focus{overflow-x:hidden}
.focus .stagec{min-width:0;max-width:min(760px,100%)}
.focus .flip{min-width:0;width:100%}
.focus .flip-in{display:grid;grid-template-columns:minmax(0,1fr);height:auto !important;min-height:min(60vh,420px)}
.focus .face{min-width:0}
.tdock,.timer-panel{min-width:0;max-width:100%}
.tdock .hscroll{max-width:100%}
.focus .face{position:relative;inset:auto;grid-area:1/1;overflow:visible;min-height:min(60vh,420px)}
.focus .face .body{overflow:visible;flex:1 0 auto}
.focus .face .pname{-webkit-line-clamp:unset;display:block;overflow:visible}
.focus .face .tline{bottom:0}
.focus .src-note{margin-top:10px;text-indent:0 !important;text-align:left !important}
.stagec.slide-next{animation:slideNext .38s var(--ease)}
.stagec.slide-prev{animation:slidePrev .38s var(--ease)}
.focus{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;background:var(--bg) !important}
#spArc{transition:stroke-dasharray .25s linear}
@keyframes slideNext{from{opacity:.15;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes slidePrev{from{opacity:.15;transform:translateX(-56px)}to{opacity:1;transform:none}}
.fnav{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:4px}
.fnav-t{flex:1;text-align:center;font-weight:600;color:var(--muted);font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-arrow{width:58px;height:58px;flex:none;border-radius:50%;border:0;background:var(--black);color:var(--black-ink);display:grid;place-items:center;box-shadow:var(--shadow-2);transition:transform .2s var(--spring)}
.nav-arrow.next{background:var(--sky-600);color:#fff}
.nav-arrow:active{transform:scale(.9)}
@media (prefers-reduced-motion: reduce){.stagec.slide-next,.stagec.slide-prev{animation:none}}

/* ---- ตัวจับเวลาติดด้านล่างของป้าย ---- */
.tdock:empty{display:none}
.tdock{margin-top:12px}
.tdock .timer-panel{box-shadow:none;background:var(--sky-50);border-color:var(--line-strong)}
.tm-main{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tm-dig{flex:1 1 180px;min-width:0}
.aclock{width:clamp(110px,28vw,150px);height:auto;aspect-ratio:1;flex:none}
.icon-btn.sm{width:34px;height:34px}

/* ---- สารบัญมาตรา จัดกลุ่มตามหมวด ไม่มีแถบเลื่อนซ้อน ---- */
.toc summary .cnt{font-weight:500;color:var(--muted);font-size:.85rem}
.toc .acc-b{max-height:none;overflow:visible}
.toc-g{border-top:1px solid var(--line)}
.toc-g:first-child{border-top:0}
.toc-g summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 2px;font-weight:600;font-size:.92rem}
.toc-g summary::-webkit-details-marker{display:none}
.toc-g summary .grow{min-width:0;overflow-wrap:anywhere}
.toc-g summary .cnt{flex:none;font-size:.78rem;color:var(--muted);font-weight:500;text-align:right}
.toc-g summary .chev{transition:transform .25s var(--ease);flex:none}
.toc-g[open] summary .chev{transform:rotate(180deg)}
.toc-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 12px}
.toc-chips .chip{min-height:34px;padding:0 10px;font-size:.85rem}

/* ---- กล่องคำแนะนำการค้นหา (แสดงเมื่อพิมพ์เท่านั้น) ---- */
.sg-host{position:relative}
.sg-box{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-2);padding:6px;max-height:min(50vh,360px);overflow:auto}
.sg-it{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 10px;min-height:44px;color:var(--ink)}
.sg-it:hover,.sg-it.on{background:var(--sky-50)}
.sg-l{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.95rem}
.sg-k{flex:none;font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- ป๊อปอัป: เลื่อนจากด้านนอก (ไม่เลื่อนภายในกล่อง) ---- */
.modal-wrap{pointer-events:auto;display:flex;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:24px 16px calc(24px + var(--safe-b))}
.modal{margin:auto;max-height:none;overflow:visible}

/* ---- ดูรูปโปรไฟล์เต็มจอ ---- */
img.avatar{cursor:zoom-in}
.tab-me img.avatar,.app-head img.avatar{cursor:pointer}
.av-view{position:fixed;inset:0;z-index:200;background:rgba(8,11,16,.86);display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .25s}
.av-view.on{opacity:1}
.av-big{width:min(82vw,82vh,560px);aspect-ratio:1;height:auto;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.5);border:4px solid #fff;transform:scale(.92);transition:transform .3s var(--spring)}
.av-view.on .av-big{transform:none}
.av-x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 18px;border-radius:999px;border:0;background:#fff;color:#0E1116;font-weight:700;box-shadow:var(--shadow-2)}

/* ---- เข้าสู่ระบบ / OTP ---- */
.otp-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px}
.otp-note>span{color:var(--sky-600);flex:none}
.otp-in input{letter-spacing:.5em;font-size:1.3rem;font-weight:700;text-align:center}
.login-note{margin-bottom:12px}

/* ---- ผู้ช่วย AI (2 รูปแบบ) ---- */
.ai2{display:flex;flex-direction:column;min-height:calc(100vh - 210px)}
.ai2-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ai2-top .btn span{margin-left:2px}
.ai2-stage{flex:1;display:flex;flex-direction:column}
.ai-hero{margin:auto;width:100%;max-width:760px;text-align:center;padding:18px 0 28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ai-logo{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px var(--sky-50),var(--shadow-2)}
.ai-hero h2{font-size:clamp(1.35rem,1.1rem + 1.2vw,2rem);text-wrap:balance}
.ai2-log{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:6px 0 16px}
.ai2-brand{display:flex;justify-content:center;margin:2px 0 6px}
.ai2-brand img{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:var(--shadow-1)}
.ai2-dock{position:sticky;bottom:calc(var(--tab-h) + 22px + var(--safe-b));z-index:20;width:100%;max-width:820px;margin:0 auto;padding-top:8px;background:linear-gradient(to bottom,transparent,var(--bg) 26%)}
@media (min-width:1024px){.ai2-dock{bottom:14px}}
/* Bolt */
.bolt-in{width:100%}
.bolt-box{width:100%;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:22px;box-shadow:var(--shadow-2);padding:12px 12px 10px;text-align:left;transition:border-color .2s,box-shadow .2s}
.bolt-box:focus-within{border-color:var(--sky-600);box-shadow:0 0 0 4px var(--sky-100),var(--shadow-2)}
.bolt-box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-size:1.05rem;line-height:1.6;min-height:52px;max-height:220px}
.bolt-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bolt-tog{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.bolt-tog input{accent-color:var(--sky-600)}
.bolt-tog svg{width:15px;height:15px}
.bolt-send{width:42px;height:42px;border-radius:12px;border:0;background:var(--sky-600);color:#fff;display:grid;place-items:center;flex:none}
.bolt-sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ai-bolt .ai2-dock .bolt-box textarea{min-height:28px}
/* Prompt input */
.pi-in{width:100%}
.pi-box{position:relative;display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:28px;padding:8px;box-shadow:var(--shadow-1)}
.pi-box:focus-within{border-color:var(--ink)}
.pi-box textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-size:1.05rem;line-height:1.55;padding:9px 4px;max-height:220px;min-width:0}
.pi-plus,.pi-send{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.pi-plus{background:var(--sky-50);color:var(--ink)}
.pi-send{background:var(--black);color:var(--black-ink)}
.pi-pop{position:absolute;left:8px;bottom:calc(100% + 8px);z-index:30;background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-2);padding:10px;min-width:min(280px,80vw);text-align:left;display:flex;flex-direction:column;gap:4px}
.pi-note{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:6px;padding:0 10px}
.pi-sug{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.pi-sq{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;min-height:48px;color:var(--ink)}
.pi-sq span{flex:1;min-width:0}
.pi-sq:hover{background:var(--sky-50)}
/* โหมดขยาย: ซ่อนแถบบนและแถบเมนูด้านล่าง */
body.ai-focus .app-head,body.ai-focus .tabbar{display:none !important}
body.ai-focus .main{padding:10px 0 12px}
body.ai-focus .ai2{min-height:calc(100vh - 24px)}
body.ai-focus .ai2-dock{bottom:10px}

/* ---- ประวัติ / อื่น ๆ ---- */
@media (max-width:420px){.fnav-t{font-size:.8rem}.nav-arrow{width:52px;height:52px}}

/* ---- ฮีโร่หมุนเวียน ---- */
.hero .hv{overflow:hidden}
.hv-card{position:absolute;left:0;top:0;overflow:hidden;border-radius:16px;background:var(--sky-100);box-shadow:0 10px 30px rgba(16,24,40,.18);will-change:transform}
.hv-card img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s var(--ease);display:block}
.hv-card img.ok{opacity:1}
.hv-veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,color-mix(in srgb,var(--bg) 78%,transparent) 0%,color-mix(in srgb,var(--bg) 30%,transparent) 55%,transparent 80%);pointer-events:none}
.hv-tilted .tg-plane{position:absolute;left:50%;top:50%;width:150%;height:190%;display:flex;gap:18px;transform:translate(-50%,-50%) rotateX(48deg) rotateZ(-30deg);transform-style:preserve-3d}
.hv-tilted .tg-col{flex:1;display:flex;flex-direction:column;gap:18px;animation:tgUp 40s linear infinite}
.hv-tilted .tg-col.down{animation-name:tgDown}
.hv-tilted .hv-card{position:relative;width:100%;aspect-ratio:4/5;flex:none}
@keyframes tgUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes tgDown{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.hv-orbital .ob-wrap{position:absolute;left:50%;top:56%;width:min(150vw,1100px);aspect-ratio:1;transform:translate(-50%,-50%)}
.hv-orbital .ob-ring{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--sky-200);animation:obSpin 90s linear infinite}
.hv-orbital .ob-ring.r1{inset:22%;animation-duration:60s;animation-direction:reverse}
.hv-orbital .ob-slot{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateY(calc(-1 * var(--r,50%)))}
.hv-orbital .r1 .ob-slot{--r:min(28vw,203px)}
.hv-orbital .r2 .ob-slot{--r:min(75vw,550px)}
.hv-orbital .ob-slot .hv-card{width:clamp(64px,10vw,120px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) rotate(calc(-1 * var(--a)));border:3px solid #fff;animation:obCounter 90s linear infinite}
.hv-orbital .r1 .ob-slot .hv-card{animation-duration:60s;animation-direction:reverse}
.hv-orbital .ob-core{position:absolute;left:50%;top:50%;width:clamp(70px,9vw,110px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 0 10px var(--sky-50),var(--shadow-2);overflow:hidden}
.hv-orbital .ob-core img{width:100%;height:100%;object-fit:cover}
@keyframes obSpin{to{transform:rotate(360deg)}}
@keyframes obCounter{to{transform:translate(-50%,-50%) rotate(calc(-1 * var(--a) - 360deg))}}
.hv-smooth .s-main{left:0;top:0;width:100%;height:100%;border-radius:0;clip-path:inset(26% 30% 26% 30% round 28px)}
.hv-smooth .s-main img{opacity:.0}
.hv-smooth .s-main img.ok{opacity:.55}
.hv-smooth .s-p{width:clamp(80px,14vw,180px);aspect-ratio:3/4}
.hv-smooth .p1{left:4%;top:16%}.hv-smooth .p2{right:5%;left:auto;top:10%}.hv-smooth .p3{left:9%;top:58%}.hv-smooth .p4{right:8%;left:auto;top:62%}
@media (max-width:640px){.hv-smooth .s-p{opacity:.55}}
@media (prefers-reduced-motion: reduce){.hv-tilted .tg-col,.hv-orbital .ob-ring,.hv-orbital .ob-slot .hv-card{animation:none}}

/* ---- วิดีโอแนะนำ ---- */
.expl-frame{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#05070F;aspect-ratio:16/9}
.expl-frame canvas{width:100%;height:100%;display:block}
.expl-cap{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:92%;background:rgba(14,17,22,.82);color:#fff;border-radius:10px;padding:6px 14px;font-size:clamp(.82rem,.7rem + .6vw,1.15rem);font-weight:600;text-align:center;line-height:1.45}
.expl-fs{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#0E1116;font-weight:700;box-shadow:var(--shadow-1)}
.expl-fs svg{width:18px;height:18px}
.expl-frame:fullscreen{border-radius:0;aspect-ratio:auto;display:grid;place-items:center}
.expl-frame:fullscreen canvas{width:100%;height:auto;max-height:100vh;object-fit:contain}
.expl-frame.pseudo-fs{position:fixed;inset:0;z-index:300;border-radius:0;aspect-ratio:auto;display:grid;place-items:center}
.expl-frame.pseudo-fs canvas{height:auto;max-height:100vh}

/* ---- แดชบอร์ดสถิติ (สีเว็บไซต์: ฟ้า ส้ม น้ำเงินเข้ม) ---- */
:root{--dv1:#2E86DE;--dv2:#F07C1E;--dv3:#1F5F99}
:root[data-theme="dark"]{--dv1:#4FA3EA;--dv2:#FF8A2A;--dv3:#9CCBF0}
@media (prefers-color-scheme: dark){:root[data-theme="system"]{--dv1:#4FA3EA;--dv2:#FF8A2A;--dv3:#9CCBF0}}
.dash-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:14px}
.dk{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--sky-50);border:1px solid var(--line)}
.dk-l{font-size:.8rem;color:var(--muted)}
.dk-v{font-size:clamp(1.3rem,1.1rem + .8vw,1.8rem);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2}
.dk-u{font-size:.75rem;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.dcard{margin:0;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-width:0}
.dcard.wide{grid-column:1/-1}
.dcard figcaption{font-weight:700;margin-bottom:10px;font-size:.95rem}
.area-wrap{position:relative}
svg.area{width:100%;height:auto;display:block;touch-action:pan-y}
.dgrid{stroke:var(--line);stroke-width:1}
.dax{fill:var(--muted);font-size:11px;font-family:inherit}
svg.area .dax{font-size:17px}
.dfill{fill:var(--dv1);opacity:.14}
.dline{fill:none;stroke:var(--dv1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dcross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.ddot{fill:var(--dv1);stroke:var(--surface);stroke-width:2}
.dhit{fill:transparent;cursor:crosshair}
.dcross.hidden,.ddot.hidden{display:none}
.dtip{position:absolute;top:4px;transform:translateX(-50%);background:var(--black);color:var(--black-ink);border-radius:10px;padding:6px 10px;font-size:.8rem;line-height:1.45;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-2)}
.donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.dnum{fill:var(--ink);font-size:22px;font-weight:700;font-family:inherit}
.dleg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.dleg li{display:flex;align-items:center;gap:8px;font-size:.88rem}
.dleg i{width:12px;height:12px;border-radius:4px;flex:none}
.dleg span{flex:1}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,9em) 1fr auto;align-items:center;gap:8px;font-size:.85rem}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;background:var(--sky-50);border-radius:4px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb-v{font-variant-numeric:tabular-nums}
.fc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fc-list li{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;border-bottom:1px dashed var(--line);padding-bottom:5px}

/* ---- กฎหมายต่างประเทศ ---- */
.fgn-entry{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.fgn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.fgn-card{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:72px}
.fgn-card:hover{border-color:var(--sky-300);box-shadow:var(--shadow-1)}
.fgn-code{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--black);color:var(--black-ink);font-weight:700;flex:none}
.ok-t{color:var(--ok)}
.fv-reader{position:fixed;inset:0;z-index:115;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.fv-in{max-width:860px;margin:0 auto;padding:14px 16px calc(40px + var(--safe-b))}
.fv-top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 0 10px}
.fv-title{min-width:0}.fv-title h3{overflow-wrap:anywhere}
.fv-meta{margin-top:6px}
.fv-head{margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line-strong);color:var(--sky-700)}
.fv-art{padding:12px 0;border-bottom:1px dashed var(--line)}
.fv-ah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fv-ah .secno{display:inline-block;background:var(--black);color:var(--black-ink);font-weight:700;border-radius:999px;padding:2px 12px;font-size:.88rem}
.fv-ah .btn{margin-left:auto}
.fv-trans:empty{display:none}
.fv-trans{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--sky-50);border:1px solid var(--line)}
.fv-tr-h{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.fv-text p{font-size:1.04rem}
/* ---- ชำระเงิน ---- */
.pay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.pay-box{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pay-box h4{display:flex;align-items:center;gap:8px;font-size:.95rem}
.pay-qr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pay-qr svg{width:220px;height:220px;background:#fff;border-radius:12px}

/* ---- v5: ตัวเลือกกลุ่มกฎหมาย ---- */
.law-scope{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.scope-btn{display:flex;align-items:center;gap:10px;text-align:left;min-height:64px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.scope-btn svg{flex:none;width:24px;height:24px;color:var(--sky-600)}
.scope-btn span{display:flex;flex-direction:column;min-width:0}
.scope-btn b{font-size:1rem;line-height:1.3}
.scope-btn small{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope-btn.on{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.scope-btn.on svg,.scope-btn.on small{color:var(--black-ink)}
#catChips.hidden{display:none}
.chip .cnt{font-size:.75em;opacity:.75;margin-left:2px}
.ctable td:nth-child(n+2),.ctable th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.ctable tr.tot td{font-weight:700;border-top:2px solid var(--line-strong)}
@media (max-width:420px){.scope-btn{padding:8px 10px;gap:8px}.scope-btn b{font-size:.92rem}}

.expl-snd{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.92);color:#0E1116;font-size:.82rem;font-weight:700;box-shadow:var(--shadow-1);pointer-events:none}
.expl-snd svg{width:16px;height:16px}
.expl-snd .onl{display:none}.expl-snd.on .onl{display:inline}.expl-snd.on .off{display:none}
