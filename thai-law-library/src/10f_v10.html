<style>
/* ======================= v10: เพิ่มเฉพาะจุด ======================= */
/* หน้าแรก: กด “อ่านเพิ่มเติม” กล่องใดขยายเฉพาะกล่องนั้น กล่องข้าง ๆ ไม่ยืดตาม ปุ่มอยู่ที่เดิม */
.grid.g2{align-items:start}
.readmore .rm-body{overflow-anchor:none}
/* จุดแจ้งเตือนแชท */
.tab .chat-dot{position:absolute;top:8px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--orange,#E8590C);box-shadow:0 0 0 2px var(--surface)}
/* หน้าสถานะ (ปิดปรับปรุง / ระงับการใช้งาน): โลโก้กึ่งกลาง เป็นระเบียบ */
.status-page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + var(--safe-b,0px));background:radial-gradient(1200px 600px at 50% -10%,var(--sky-100,#DCEEFB),transparent 70%),var(--bg)}
.sp-card{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-2);padding:28px 24px;text-align:center}
.sp-logo{display:flex;justify-content:center}
.sp-logo img{width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 6px 24px rgba(31,95,153,.18);object-fit:contain}
.sp-brand{margin-top:10px;font-weight:800;letter-spacing:.04em;color:var(--sky-700);font-size:.85rem}
.sp-badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.85rem;background:var(--sky-50);color:var(--sky-700)}
.status-page.o .sp-badge{background:#FFF1E6;color:#B4470A}
.status-page.bad .sp-badge{background:#FDECEC;color:#B42318}
.sp-badge svg.i{width:18px;height:18px}
.sp-card h1{font-size:1.35rem;margin:12px 0 6px;line-height:1.4}
.sp-lead{color:var(--muted);margin:0 auto 14px;max-width:520px;line-height:1.7}
.sp-rows{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:8px}
.sp-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.sp-ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sky-50);color:var(--sky-700)}
.status-page.bad .sp-ic{background:#FDECEC;color:#B42318}
.status-page.o .sp-ic{background:#FFF1E6;color:#B4470A}
.sp-l{font-size:.8rem;font-weight:700;color:var(--muted)}
.sp-v{white-space:pre-line;line-height:1.7;overflow-wrap:anywhere;text-align:justify}
.sp-note{margin-top:12px;text-align:left;color:var(--muted);line-height:1.7}
.sp-note p{margin:0 0 4px}
.sp-live{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:.85rem;color:var(--muted)}
.sp-dot{width:8px;height:8px;border-radius:50%;background:#1E8E3E;animation:spPulse 1.6s infinite}
@keyframes spPulse{0%{box-shadow:0 0 0 0 rgba(30,142,62,.5)}70%{box-shadow:0 0 0 8px rgba(30,142,62,0)}100%{box-shadow:0 0 0 0 rgba(30,142,62,0)}}
.sp-act{margin-top:14px;display:flex;justify-content:center}
.sp-foot{margin-top:14px;font-size:.8rem;color:var(--muted)}
@media (max-width:480px){.sp-card{padding:22px 16px;border-radius:20px}.sp-logo img{width:80px;height:80px}.sp-card h1{font-size:1.15rem}}
/* ป๊อปอัปกติกาแชท: X ขวาบน · ยกเลิก ซ้ายล่าง · ตกลง ขวาล่าง */
.ct-card{position:relative;display:flex;flex-direction:column;max-height:calc(100dvh - 32px);width:min(680px,calc(100vw - 24px));padding:0;overflow:hidden}
.ct-x{position:absolute;top:10px;right:10px;z-index:2}
.ct-head{display:flex;gap:12px;align-items:center;padding:18px 56px 12px 18px;border-bottom:1px solid var(--line)}
.ct-head h3{margin:0;font-size:1.05rem}
.ct-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 18px;line-height:1.75;text-align:justify}
.ct-body section{margin-bottom:12px}
.ct-body h4{margin:0 0 4px;font-size:.98rem;color:var(--sky-700)}
.ct-body p{margin:0}
.ct-actions{display:flex;justify-content:space-between;gap:10px;padding:12px 18px calc(12px + var(--safe-b,0px));border-top:1px solid var(--line);background:var(--surface)}
.ct-actions .btn{min-width:120px}
/* แชท */
.chat10{display:flex;flex-direction:column;height:calc(100dvh - 210px);min-height:360px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ch-head{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.ch-head h2{margin:0;font-size:1.05rem}
.ch-log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg);overflow-anchor:none}
.ch-day{text-align:center;margin:6px 0}
.ch-day span{font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.ch-msg{max-width:82%;display:flex;flex-direction:column}
.ch-msg.me{align-self:flex-end;align-items:flex-end}
.ch-msg.adm{align-self:flex-start;align-items:flex-start}
.ch-who{font-size:.75rem;font-weight:700;color:var(--sky-700);display:flex;gap:4px;align-items:center;margin-bottom:2px}
.ch-who svg.i{width:14px;height:14px}
.ch-bub{padding:9px 13px;border-radius:16px;line-height:1.6;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.ch-msg.me .ch-bub{background:var(--sky-600);color:#fff;border-bottom-right-radius:5px}
.ch-msg.adm .ch-bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.ch-meta{font-size:.7rem;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
.ch-st{display:inline-flex;gap:3px;align-items:center;border:0;background:none;padding:0;font:inherit;color:inherit}
.ch-st svg.i{width:12px;height:12px}
.ch-st.bad{color:var(--bad,#B42318);font-weight:700;cursor:pointer}
.ch-form{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.ch-form textarea{flex:1;resize:none;min-height:44px;max-height:180px;border:1.5px solid var(--line-strong);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.5;background:var(--bg);color:var(--ink)}
.ch-send{height:44px;flex:none}
.ch-hint{padding:0 12px 10px;background:var(--surface)}
@media (max-width:640px){.chat10{height:calc(100dvh - 190px);border-radius:16px}.ch-send span{display:none}.ch-msg{max-width:90%}}
@media (min-width:1025px){.chat10{height:calc(100dvh - 150px)}}
/* จอแคบ: ชิดซ้าย ไม่ให้ช่องว่างระหว่างคำกว้างผิดปกติ */
@media (max-width:640px){.sp-v,.ct-body{text-align:left}}
</style>
