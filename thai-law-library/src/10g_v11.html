<style>
/* ======================= v11 ======================= */
/* ป๊อปอัปทุกชนิด: เลื่อนภายนอก (ทั้งหน้าต่างป๊อปอัป) เท่านั้น ไม่มีกล่องเลื่อนซ้อนด้านใน · ไม่เลื่อนซ้าย–ขวา */
.modal-wrap{overflow-y:auto !important;overflow-x:hidden !important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-gutter:stable}
.modal-wrap>.modal{max-height:none !important;overflow:visible !important;max-width:min(100%,var(--m-max,560px));margin:auto}
.modal-wrap .modal *:not(textarea):not(select):not(input):not(img):not(video):not(canvas){max-height:none !important}
.modal-wrap .modal .modal-body,.modal-wrap .modal .ct-body,.modal-wrap .modal .pp-list{overflow-y:visible !important}
.modal-wrap .modal,.modal-wrap .modal *{overflow-wrap:anywhere}
.modal-wrap .modal table{max-width:100%}
/* กติกาแชท (v10) ให้เลื่อนภายนอกเช่นกัน */
.ct-card{max-height:none !important;overflow:visible !important;display:block}
.ct-body{overflow:visible !important;flex:none}
/* ป๊อปอัปมาตรฐาน v11 */
.p11{--m-max:680px;position:relative;padding:0}
.p11-x{position:absolute;top:10px;right:10px;z-index:2}
.p11-head{display:flex;gap:12px;align-items:center;padding:18px 56px 12px 18px;border-bottom:1px solid var(--line)}
.p11-head h3{margin:0;font-size:1.05rem;line-height:1.45}
.p11-body{padding:14px 18px;line-height:1.75;text-align:left}
.p11-body p{margin:0 0 10px}
.p11-body section{margin-bottom:12px}
.p11-body h4{margin:0 0 4px;font-size:.98rem;color:var(--sky-700)}
.pp-rows{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.pp-row{display:flex;flex-wrap:wrap;gap:4px 10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pp-row b{min-width:150px;color:var(--muted);font-size:.85rem}
.p11-actions{display:flex;justify-content:space-between;gap:10px;padding:12px 18px calc(12px + var(--safe-b,0px));border-top:1px solid var(--line)}
.p11-actions.center{justify-content:center}
.p11-actions .btn{min-width:120px}
/* ผู้ช่วย AI: ไม่ให้ข้อความลอดใต้กรอบพิมพ์ (พื้นทึบใต้กรอบถึงขอบจอ) */
.ai2-dock{background:var(--bg) !important;box-shadow:0 -14px 14px -2px var(--bg)}
.ai2-dock::after{content:'';position:absolute;left:-50vw;right:-50vw;top:100%;height:calc(var(--tab-h,64px) + 60px + var(--safe-b,0px));background:var(--bg);pointer-events:none}
.ai2-dock::before{content:'';position:absolute;left:-50vw;right:-50vw;top:0;bottom:0;background:var(--bg);z-index:-1}
.ai2-log{padding-bottom:24px}
/* โหมดขยาย/โฟกัสเฉพาะเนื้อหา */
body.focus11 .app-head,body.focus11 .tabbar{display:none !important}
body.focus11 .main{padding-top:12px}
.focus-exit{position:fixed;top:calc(10px + var(--safe-t,0px));right:12px;z-index:90;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;box-shadow:var(--shadow-2)}
.focus-exit svg.i{width:18px;height:18px}
body.focus11 .chat10{height:calc(100dvh - 90px)}
body.focus11 .main .wrap{padding-top:44px}
#chFocus{flex:none}
#chFocus span{margin-left:4px}
@media (max-width:480px){#chFocus span{display:none}}
/* ตัวเลขข้อความผู้ดูแลที่ปุ่มแชท (แนวตั้ง/แนวนอน) */
.tab .chat-cnt{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--orange,#E8590C);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--surface);z-index:2}
.ch-msg.pend{opacity:.85}
/* โหมดทดลองใช้งาน */
body.guest .tab[data-tab="chat"],body.guest #tabMe{display:none !important}
#btnMainSite{margin-left:6px;white-space:nowrap}
@media (max-width:520px){#btnMainSite span{display:none}}
/* ให้คะแนน */
.rate11{max-width:760px;margin:0 auto}
.r-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.r-head h2{margin:0;display:flex;gap:8px;align-items:center}
.r-sum{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:560px){.r-sum{grid-template-columns:1fr}}
.r-avg{display:flex;flex-direction:column;align-items:center;gap:4px}
.r-avg b{font-size:2.2rem;line-height:1}
.srow{display:inline-flex;gap:2px;vertical-align:middle}
.srow .sr svg.i{width:16px;height:16px;color:var(--line-strong)}
.srow .sr.on svg.i{color:#F5A524;fill:#F5A524}
.r-dist{display:flex;flex-direction:column;gap:4px}
.r-bar{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;font-size:.85rem}
.r-bar i{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.r-bar em{display:block;height:100%;background:#F5A524;border-radius:99px}
.r-form{margin-top:12px}
.r-stars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.r-star{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px;min-width:54px;font-weight:700;color:var(--muted)}
.r-star svg.i{width:30px;height:30px}
.r-star.on{border-color:#F5A524;color:#B7791F}
.r-star.on svg.i{fill:#F5A524;color:#F5A524}
.r-lab{text-align:center;font-weight:700;margin-bottom:10px}
.r-form textarea{width:100%;min-height:90px;resize:none;overflow:hidden;border:1.5px solid var(--line-strong);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.6;background:var(--bg);color:var(--ink);box-sizing:border-box}
.r-lh{margin:16px 2px 8px}
.r-item{margin-bottom:8px}
.r-item.mine{border-color:#F5A524}
.r-ih{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.r-text{margin-top:6px;white-space:normal;overflow-wrap:anywhere;line-height:1.65}
/* แจ้งเตือน: ปุ่มรีเฟรช */
.spin11 svg.i{animation:spin11 .8s linear infinite}
@keyframes spin11{to{transform:rotate(360deg)}}
/* อนุสัญญา: อ่านภายในเว็บไซต์ */
.tw-item{cursor:pointer}
.tw-open{margin-top:4px;font-size:.8rem;font-weight:700;color:var(--sky-700);display:flex;gap:4px;align-items:center}
.tw-open svg.i{width:14px;height:14px}
.tw-src{color:var(--muted)}
.tr11{position:fixed;inset:0;z-index:110;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tr11-in{max-width:900px;margin:0 auto;padding:0 12px calc(24px + var(--safe-b,0px))}
.tr11-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.tr11-bar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr11-body{padding-top:12px}
.tr11-h h2{margin:8px 0 4px;line-height:1.4}
.tr11-tr{margin:12px -18px;padding:8px 18px}
.tr11-text p{margin:0 0 10px;line-height:1.8;text-align:justify;text-justify:inter-character;overflow-wrap:anywhere}
@media (max-width:640px){.tr11-text p{text-align:left}}
/* ดูดวง */
.horo-form .hf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.horo-form .input{min-width:0}
.horo-form .input input{min-width:0;width:100%;box-sizing:border-box}
.hf-chk{display:flex;gap:8px;align-items:center;margin:10px 0 12px}
.horo-gal{margin-top:12px}
.hg-tabs{margin:8px 0}
.hg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.hg-grid figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.hg-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.hg-grid figcaption{padding:6px 8px;font-size:.78rem;line-height:1.45}
.hg-grid figcaption span{color:var(--muted)}
.hg-note{margin-top:6px}
.horo-out{margin-top:12px;line-height:1.8}
.horo-out h2{margin:0 0 4px}
.horo-out h3{margin:16px 0 6px;color:var(--sky-700)}
.horo-out p{text-align:left;overflow-wrap:anywhere}
.hr-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px;margin:10px 0}
.hr-facts div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);display:flex;flex-direction:column}
.hr-facts b{font-size:.8rem;color:var(--muted)}
.hr-tk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px;margin:8px 0}
.hr-tk div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.hr-tk div.good{border-color:#1E8E3E}
.hr-tk div.bad{border-color:var(--bad,#B42318)}
.hr-tk small{color:var(--muted);line-height:1.4}
.hr-area{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.hr-area .lv{margin-left:8px;font-size:.78rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--sky-50);color:var(--sky-700)}
.hr-area.good .lv{background:#E7F6EC;color:#1E7B34}
.hr-area.care .lv{background:#FDECEC;color:#B42318}
.hr-area p{margin:6px 0 0}
</style>
