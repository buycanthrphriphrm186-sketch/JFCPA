<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THAI LAW LIBRARY | คลังกฎหมาย</title>
<meta name="description" content="คลังกฎหมาย THAI LAW LIBRARY — แหล่งรวบรวมกฎหมายไทยเพื่อการศึกษา ค้นคว้า และการเข้าถึงกฎหมายอย่างเป็นระบบ">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="THAI LAW LIBRARY | คลังกฎหมาย">
<meta property="og:description" content="แหล่งรวบรวมกฎหมายไทยเพื่อการศึกษาและค้นคว้า ป้ายพลิกมาตรา ค้นหาอัจฉริยะ และกฎหมายต่างประเทศจากแหล่งทางการ">
<meta property="og:image" content="/icon-192.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  :root{--ink:#0E1116;--muted:#5D6878;--sky:#2E86DE;--line:#E3ECF5;--bg:#FFFFFF}
  @media (prefers-color-scheme: dark){:root{--ink:#EEF2F7;--muted:#9AA6B5;--line:#222B38;--bg:#0C0F14}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Sarabun","TH Sarabun New",system-ui,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
  #boot{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;transition:opacity .5s}
  #boot.gone{opacity:0;pointer-events:none}
  .ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sky);animation:sp 1s linear infinite}
  .ring img{width:110px;height:110px;border-radius:50%;background:#fff;object-fit:cover}
  h1{font-size:1.05rem;letter-spacing:.12em;margin:18px 0 2px}
  h2{font-size:1.5rem;margin:0 0 10px}
  p{color:var(--muted);max-width:440px;margin:0 auto;line-height:1.6}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.ring::before{animation:none}}
</style>
<script src="/config.js"></script>
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div>
    <div class="ring" style="margin:0 auto"><img src="/logo.jpg" alt="ตราสัญลักษณ์ THAI LAW LIBRARY"></div>
    <h1>THAI LAW LIBRARY</h1>
    <h2>คลังกฎหมาย</h2>
    <p id="bootMsg">กำลังเชื่อมต่อระบบ…</p>
  </div>
</div>
<script>
(function () {
  var url = String(window.TLL_APP_URL || '');
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url);
  var msg = document.getElementById('bootMsg');
  if (!ok) { msg.textContent = 'เว็บไซต์กำลังเตรียมเปิดให้บริการ กรุณากลับมาใหม่อีกครั้งในภายหลัง'; return; }
  var f = document.createElement('iframe');
  f.id = 'app'; f.title = 'THAI LAW LIBRARY | คลังกฎหมาย';
  f.allow = 'fullscreen; clipboard-write; geolocation';
  f.setAttribute('allowfullscreen', '');
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.src = url;
  f.onload = function () { document.getElementById('boot').classList.add('gone'); };
  setTimeout(function () { msg.textContent = 'ระบบกำลังโหลด อาจใช้เวลาสักครู่ในการเข้าใช้งานครั้งแรก'; }, 6000);
  document.body.insertBefore(f, document.body.firstChild);
})();
</script>
<noscript><p style="text-align:center">กรุณาเปิดใช้งาน JavaScript เพื่อใช้งานคลังกฎหมาย</p></noscript>
</body>
</html>
