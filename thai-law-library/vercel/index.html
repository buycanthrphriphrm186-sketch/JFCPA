<body>
<div id="boot" role="status" aria-live="polite">

  </div>
</div>
<script>
(function () {
  var RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
  var URL0 = RE.test(String(window.TLL_APP_URL || '')) ? window.TLL_APP_URL : '';
  /* URL หลักล่าสุดจาก GitHub (เปลี่ยนได้โดยไม่ต้อง Deploy Vercel ใหม่) — รอไม่เกิน 1.2 วินาที ถ้าไม่ได้ใช้ URL ใน config.js */
  var EXTRA = 'https://raw.githubusercontent.com/buycanthrphriphrm186-sketch/JFCPA/claude/legal-ai-website-system-4h1org/thai-law-library/db/app-urls.json';
  var msg = document.getElementById('bootMsg'), started = false;
  var open = function (url) {
    if (started || !url) return; started = true;
    var f = document.createElement('iframe');
    f.id = 'app'; f.title = 'THAI LAW LIBRARY | คลังกฎหมาย';
    f.allow = 'fullscreen; clipboard-write; geolocation; autoplay';
    f.setAttribute('allowfullscreen', '');
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.src = url;
    var loaded = false;
    f.onload = function () { loaded = true; document.getElementById('boot').classList.add('gone'); };
    setTimeout(function () { if (!loaded) msg.textContent = 'กำลังเปิดเว็บไซต์คลังกฎหมาย…'; }, 4000);
    document.body.insertBefore(f, document.body.firstChild);
  };
  try { localStorage.removeItem('tll.appUrl'); } catch (e) {}
  var t0 = setTimeout(function () { open(URL0); }, 1200);
  fetch(EXTRA + '?t=' + Math.floor(Date.now() / 60000), { credentials: 'omit', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    clearTimeout(t0); open(j && RE.test(String(j.primary || '')) ? j.primary : URL0);
  }).catch(function () { clearTimeout(t0); open(URL0); });
})();
</script>
